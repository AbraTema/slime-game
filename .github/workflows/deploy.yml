name: Deploy game

# Every push to main publishes the game to GitHub Pages
# and attaches a ready-to-upload ZIP for Yandex Games to the run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect game files
        run: |
          mkdir -p _site
          cp -r index.html lib src _site/

      - name: Zip for Yandex Games
        run: cd _site && zip -r ../slime-game-yandex.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: slime-game-yandex
          path: slime-game-yandex.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
